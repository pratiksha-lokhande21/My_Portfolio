<!DOCTYPE html>
<html>
<head>
    <title>Table Structure</title>
    <style>
        table {
            width: 500px;
            height: 220px;
            border-collapse: collapse;
        }
        td {
            border: 1px solid black;
        }
    </style>
</head>
<body>

<h2>Table Structure</h2>

<table>
    <tr>
        <td rowspan="2"></td>
        <td rowspan="2"></td>
        <td colspan="3"></td>
    </tr>
    <tr>
        <td></td>
        <td rowspan="1"></td>
        <td></td>
    </tr>
    <tr>
        <td colspan="2"></td>
        <td></td>
        <td colspan="2"></td>
    </tr>
</table>

</body>
</html>
