
<!DOCTYPE html>
<html>
<head>
    <title>Multiplication Tables</title>
</head>
<body>
    <h2>Multiplication Tables from 1 to 30</h2>
    <div id="result"></div>

    <script>
        let output = "";

        for (let i = 1; i <= 30; i++) {
            output += "<h3>Table of " + i + "</h3>";

            for (let j = 1; j <= 10; j++) {
                output += i + " x " + j +
                          " = " + (i * j) + "<br>";
            }
        }

        document.getElementById("result").innerHTML = output;
    </script>
</body>
</html>
