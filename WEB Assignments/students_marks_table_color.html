<!DOCTYPE html>
<html>
<head>
    <title>Student Marks</title>
    <style>
        table {
            border-collapse: collapse;
            width: 500px;
            text-align: center;
        }

        th, td {
            border: 1px solid black;
            padding: 6px;
        }

        .green {
            color: seagreen;
        }

        .red {
            color: indianred;
        }

        .blue {
            color: deepskyblue;
        }
    </style>
</head>
<body>

<h2>Student Marks Details</h2>

<table>
    <tr class="green">
        <th colspan="2">Student Details</th>
        <th colspan="2">Semester I</th>
        <th colspan="2">Semester II</th>
    </tr>
    <tr class="red">
        <th>Roll No.</th>
        <th>Name</th>
        <th>Theory</th>
        <th>Practical</th>
        <th>Theory</th>
        <th>Practical</th>
    </tr>
    <tr class="blue">
        <td>101</td>
        <td>Amit</td>
        <td>78</td>
        <td>85</td>
        <td>82</td>
        <td>90</td>
    </tr>
    <tr class="blue">
        <td>102</td>
        <td>Neha</td>
        <td>89</td>
        <td>92</td>
        <td>91</td>
        <td>94</td>
    </tr>
</table>

</body>
</html>
