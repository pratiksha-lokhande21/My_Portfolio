<!DOCTYPE html>
<html>
<head>
    <title>Table Attributes</title>

    <style>
        table {
            width: 80%;
            border-collapse: collapse;
            text-align: center;
            margin: 20px auto;
        }

        th, td {
            border: 2px solid black;
            padding: 10px;
        }

        th {
            background-color: lightblue;
        }

        caption {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<table>
    <caption>Student Records</caption>

    <tr>
        <th>Roll No.</th>
        <th>Name</th>
        <th>Course</th>
        <th>Semester</th>
    </tr>

    <tr>
        <td>101</td>
        <td>Amit</td>
        <td>MCA</td>
        <td>II</td>
    </tr>

    <tr>
        <td>102</td>
        <td>Neha</td>
        <td>MCA</td>
        <td>II</td>
    </tr>

    <tr>
        <td colspan="4">End of Student Records</td>
    </tr>
</table>

</body>
</html>
