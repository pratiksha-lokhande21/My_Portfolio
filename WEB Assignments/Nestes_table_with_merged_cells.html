<!DOCTYPE html>
<html>
<head>
    <title>Nested Table 2</title>
</head>
<body>

<h2>Nested Table with Merged Cells</h2>

<table border="1" cellpadding="10" cellspacing="0">
    <tr>
        <th>Table Heading</th>
        <th colspan="2">Table Heading</th>
        <th>Table Heading</th>
    </tr>
    <tr>
        <td>Table Data</td>
        <td colspan="2">Table Data</td>
        <td>Table Data</td>
    </tr>
    <tr>
        <td rowspan="2">Table Data</td>
        <td colspan="2">
            <table border="1" cellpadding="5" width="100%">
                <tr>
                    <th>Heading 1</th>
                    <th>Heading 2</th>
                    <th>Heading 3</th>
                </tr>
                <tr>
                    <td>Data 1</td>
                    <td>Data 2</td>
                    <td>Data 3</td>
                </tr>
                <tr>
                    <td>Data 4</td>
                    <td>Data 5</td>
                    <td>Data 6</td>
                </tr>
            </table>
        </td>
        <td rowspan="2">Table Data</td>
    </tr>
    <tr>
        <td colspan="2">Table Data</td>
    </tr>
    <tr>
        <td>Table Data</td>
        <td colspan="2">Table Data</td>
        <td>Table Data</td>
    </tr>
</table>

</body>
</html>
