
<!DOCTYPE html>
<html>
<head>
    <title>Odd Numbers</title>
</head>
<body>
    <h2>Odd Numbers from 1 to 100</h2>
    <p id="result"></p>

    <script>
        let output = "";

        for (let i = 1; i <= 100; i++) {
            if (i % 2 !== 0) {
                output += i + " ";
            }
        }

        document.getElementById("result").textContent = output;
    </script>
</body>
</html>
