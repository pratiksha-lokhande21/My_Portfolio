
<!DOCTYPE html>
<html>
<head>
    <title>Date and Time</title>
</head>
<body>
    <h2>Current Date and Time</h2>

    <button onclick="showDateTime()">Show Date and Time</button>

    <script>
        function showDateTime() {
            let current = new Date();
            alert("Current Date and Time:\n" +
                  current.toLocaleString());
        }
    </script>
</body>
</html>
